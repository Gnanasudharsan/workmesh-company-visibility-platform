name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  quality:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workmesh/core build
      - run: pnpm --filter @workmesh/api exec prisma generate
      - name: Lint
        run: pnpm -r run lint
      - name: Typecheck
        run: pnpm -r run typecheck
      - name: Core unit tests (policy matrix, graph algorithms, state machines)
        run: pnpm --filter @workmesh/core test

  integration:
    name: API integration & authorization (Postgres + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: workmesh_owner
          POSTGRES_PASSWORD: ci-owner-password
          POSTGRES_DB: workmesh
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U workmesh_owner -d workmesh" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://workmesh_owner:ci-owner-password@localhost:5432/workmesh?schema=public
      APP_DATABASE_URL: postgresql://workmesh_app:ci-app-password@localhost:5432/workmesh?schema=public
      REDIS_URL: redis://localhost:6379
      WEB_ORIGIN: http://localhost:3002
      DEMO_PASSWORD: ci-demo-password
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workmesh/core build
      - name: Create restricted app role and test database
        env:
          PGPASSWORD: ci-owner-password
        run: |
          psql -h localhost -U workmesh_owner -d workmesh -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE workmesh_app LOGIN PASSWORD 'ci-app-password' NOSUPERUSER NOBYPASSRLS;
          CREATE DATABASE workmesh_test OWNER workmesh_owner;
          SQL
      - run: pnpm --filter @workmesh/api exec prisma generate
      - name: Integration tests (tenancy, authorization matrix, workflows, realtime)
        run: pnpm --filter @workmesh/api test

  web:
    name: Web unit tests & production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workmesh/core build
      - name: Web unit tests
        run: pnpm --filter @workmesh/web test
      - name: Production build
        run: pnpm --filter @workmesh/web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8020

  e2e:
    name: Playwright critical journeys
    runs-on: ubuntu-latest
    needs: [quality]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: workmesh_owner
          POSTGRES_PASSWORD: ci-owner-password
          POSTGRES_DB: workmesh
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U workmesh_owner -d workmesh" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      CI: "true"
      DATABASE_URL: postgresql://workmesh_owner:ci-owner-password@localhost:5432/workmesh?schema=public
      APP_DATABASE_URL: postgresql://workmesh_app:ci-app-password@localhost:5432/workmesh?schema=public
      REDIS_URL: redis://localhost:6379
      WEB_ORIGIN: http://localhost:3002
      NEXT_PUBLIC_API_URL: http://localhost:8020
      DEMO_MODE: "true"
      DEMO_PASSWORD: ci-demo-password
      METRICS_TOKEN: ci-metrics-token
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create restricted app role
        env:
          PGPASSWORD: ci-owner-password
        run: psql -h localhost -U workmesh_owner -d workmesh -v ON_ERROR_STOP=1 -c "CREATE ROLE workmesh_app LOGIN PASSWORD 'ci-app-password' NOSUPERUSER NOBYPASSRLS;"
      - run: pnpm --filter @workmesh/core build
      - run: pnpm --filter @workmesh/api exec prisma migrate deploy
      - run: pnpm --filter @workmesh/api build
      - run: pnpm --filter @workmesh/web build
      - run: pnpm --filter @workmesh/web exec playwright install --with-deps chromium
      - name: Validate Mermaid diagrams in README and docs
        run: node scripts/validate-mermaid.mjs
      - name: Run journeys A-G
        run: pnpm --filter @workmesh/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: workmesh-api:ci
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: workmesh-web:ci

  security:
    name: Secret scanning & dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks (full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Audit production dependencies (fail on critical)
        run: pnpm audit --prod --audit-level critical
